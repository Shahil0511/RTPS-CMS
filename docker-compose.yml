# Libas VMS - application + MediaMTX streaming server.
# PostgreSQL is external (DATABASE_URL in .env); every table lives in the "vms" schema.
#
#   docker compose up -d --build
#
# Set MEDIAMTX_PUBLIC_WEBRTC_URL / MEDIAMTX_PUBLIC_HLS_URL in .env to the host's
# LAN address (e.g. http://192.168.1.10:8889) so browsers on other machines can connect.

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    network_mode: host # simplest way to expose WebRTC UDP + reach LAN cameras
    environment:
      MTX_AUTHHTTPADDRESS: http://127.0.0.1:3000/api/internal/mediamtx-auth?k=${MEDIAMTX_AUTH_SECRET}
      MTX_PATHDEFAULTS_RECORDPATH: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: ${RECORD_SEGMENT_MINUTES:-15}m
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RECORDING_ROOT: /app/recordings
      MEDIAMTX_API_URL: http://127.0.0.1:9997
      MEDIAMTX_PLAYBACK_URL: http://127.0.0.1:9996
    volumes:
      - ./recordings:/app/recordings
    depends_on:
      - mediamtx
